# What `cargo deny check licenses` goes by: the licences a crate the server is
# built from may have. They are the ones that go with the server's own, the
# AGPL: see docs/adr/0019-the-server-is-under-the-agpl.md.
#
# A crate under a licence that is not here fails the check. Add a licence
# only after making sure it goes with the AGPL.

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The server's own crates are not published, and their licence is the
# project's.
[licenses.private]
ignore = true
